apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-java-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devops-java-app

  template:
    metadata:
      labels:
        app: devops-java-app

    spec:
      containers:
        - name: devops-java-app
          image: devops-java-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
